name: Manuscript release verification

on:
  pull_request:
    paths:
      - 'manuscript_release_2026_10/**'
      - '.github/workflows/manuscript-release.yml'
      - 'README.md'
      - 'requirements.txt'
      - 'unified_pipeline_clean/README.md'
      - 'unified_pipeline_clean/docs/**'
  push:
    branches: [main]
    paths:
      - 'manuscript_release_2026_10/**'
      - '.github/workflows/manuscript-release.yml'
      - 'README.md'
      - 'requirements.txt'
      - 'unified_pipeline_clean/README.md'
      - 'unified_pipeline_clean/docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The reference patch version has no setup-python Windows binary.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: manuscript
          python-version: '3.10.16'
          channels: conda-forge
          conda-remove-defaults: 'true'
      - name: Install pinned analysis dependencies
        run: conda run --no-capture-output -n manuscript python -m pip install -r requirements.txt
      - name: Verify release, replay annotations and check saved model metrics
        run: conda run --no-capture-output -n manuscript python -B -X utf8 manuscript_release_2026_10/scripts/run_release_checks.py --out "$env:RUNNER_TEMP/manuscript-release-verification"
