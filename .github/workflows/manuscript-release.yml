name: Manuscript release verification

on:
  pull_request:
    paths:
      - 'manuscript_release_2026_10/**'
      - '.github/workflows/manuscript-release.yml'
  push:
    branches: [main]
    paths:
      - 'manuscript_release_2026_10/**'
      - '.github/workflows/manuscript-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.16'
          cache: pip
          cache-dependency-path: manuscript_release_2026_10/requirements.txt
      - name: Install pinned analysis dependencies
        run: python -m pip install -r manuscript_release_2026_10/requirements.txt
      - name: Verify release, replay annotations and check saved model metrics
        run: python -B -X utf8 manuscript_release_2026_10/scripts/run_release_checks.py --out "$env:RUNNER_TEMP/manuscript-release-verification"
